<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Budget Visualizer</title>

    <link rel="stylesheet" href="css/style.css" />

    <!-- Chart.js from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
    <!-- App logic -->
    <script src="js/app.js" defer></script>
  </head>
  <body>

    <!-- Balance_Display -->
    <header class="header">
      <div class= "header-content">
      <h1>Expense Budget Visualizer</h1>
      <p>Track your income, expenses, and savings in one place.</p>
      </div>
    </header>

    <main>

      <div class="top-grid">

      <!-- Dashboard Summary -->
       <section id="summary-section">

        <h2>Dashboard Overview</h2>

        <div class="summary-container">

        <div class="summary-card">
          <h3>Total Balance</h3>
          <p id="total-balance">Rp 0</p>
        </div>
        
        <div class="summary-card">
          <h3>Total Income</h3>
          <p id="total-income">Rp 0</p>
        </div>

        <div class="summary-card">
          <h3>Total Expense</h3>
          <p id="total-expense">Rp 0</p>
        </div>

        <div class="summary-card">
          <h3>Total Savings</h3>
          <p id="total-savings">Rp 0</p>
        </div>

        </div>

       </section>

      <!-- Input_Form -->
      <section id="input-section">
        <h2>Add Transactions</h2>
        <form id="expense-form" novalidate>
          <div class="form-group">
            <label for="transactions-type">Transactions Type</label>

            <select id="transactions-type">
              <option value="expenses">Expense</option>
              <option value="income">Income</option>
            </select>
          </div>

          <div class="form-group">
            <label for="transaction-title">
              Title
            </label>

            <input
            type="text"
            id="transaction-title"
            placeholder="Example: Salary or Coffee"
            />
          </div>

          <div class="form-group">
            <label for="transaction-amount">
              Amount
            </label>

           <input
            type="text"
            id="transaction-amount"
            placeholder="Contoh: 10.000"
            />
          </div>

          <div class="form-group">
            <label for="transaction-currency">
              Currency 
            </label>

            <select id="transaction-currency">
              <option value="IDR">🇮🇩 Indonesian Rupiah (IDR)</option>
              <option value="JPY">🇯🇵 Japanese Yen (JPY)</option>
              <option value="USD">🇺🇸 US Dollar (USD)</option> 
            </select>
          </div>

          <div class="form-group">
            <label for="transaction-category">
              Category
            </label>

            <select id="transaction-category">
              <option>Food</option>
              <option>Transport</option>
              <option>Shopping</option>
              <option>Bills</option>
              <option>Entertainment</option>
              <option>Education</option>
              <option>Health</option>
              <option>Salary</option>
              <option>Freelance</option>
              <option>Investment</option>
            </select>
          </div>
          
          <div class="form-group">
            <label for="transaction-date">
              Date
            </label>

            <input
            type="date"
            id="transaction-date"
            />
          </div>

          <div class="form-group">
            <label for="transaction-note">
              Notes
            </label>

            <textarea
            id="transaction-note"
            rows="3"
            placeholder="Optional..."
            ></textarea>
          </div>
          
          <div class="form-actions">
            <button type="submit">

              Save Transaction

            </button>

            <button
            type="button"
            id="reset-data"
            >

            Reset All Data

            </button>

          </div>

          </form>
</section>
</div>

<div class="bottom-grid">

 <!-- Chart -->
      <section id="chart-section">
        <h2>Spending by Category</h2>
        <p id="chart-empty-msg">No spending data available.</p>
        <canvas id="expense-chart"></canvas>
      </section>

           <!-- Transaction_List -->
      <section id="list-section">
        <h2>Transactions</h2>
        <div id="transaction-list">
          <p id="list-empty-msg">No transactions recorded yet.</p>
        </div>
      </section>

</div>

    </main>

  </body>
</html>
